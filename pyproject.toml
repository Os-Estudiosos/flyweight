[project]
name = "flyweight"
version = "0.1.0"
description = "Jogo com pygame comparando uma floresta com e sem o padrão Flyweight"
readme = "README.md"
authors = [
    { name = "jaopredo", email = "joao.profissional.45@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "psutil>=7.2.2",
    "pygame-ce>=2.5.8",
]

[project.scripts]
jogo-sem-flyweight = "flyweight:main_naive"
jogo-com-flyweight = "flyweight:main_flyweight"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
